spring.application.name=pipeline

db.ip=${SPRING_DATASOURCE_IP:127.0.0.1}
db.port=${SPRING_DATASOURCE_PORT:5432}
db.name=${SPRING_DATASOURCE_NAME:kubeci}
db.username=${SPRING_DATASOURCE_USERNAME:kubeci}
db.password=${SPRING_DATASOURCE_PASSWORD:kubeci}
db.driver=org.postgresql.Driver
db.protocol=jdbc:postgresql:

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
application-description=CI pipelines runner
application-version=0.1